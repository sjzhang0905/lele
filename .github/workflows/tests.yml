name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install OpenGL runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install LELE and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run regression tests
        run: python -m pytest tests -q --junitxml=reports/tests.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LELE-test-report
          path: reports/tests.xml
          if-no-files-found: error
