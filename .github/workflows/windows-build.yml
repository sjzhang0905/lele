name: Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and PyInstaller
        run: python -m pip install '.[build]'
      - name: Build LELE
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LELE --icon lele/assets/lele.ico --collect-all vtkmodules --collect-all ase --collect-data lele --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor launch_app.py
      - name: Write version record
        run: python -c "from pathlib import Path; from lele import APP_TITLE; Path('dist/LELE/VERSION.txt').write_text(APP_TITLE + '\n', encoding='utf-8')"
      - name: Upload complete executable directory
        uses: actions/upload-artifact@v7
        with:
          name: LELE-windows-x64
          path: dist/LELE/
          if-no-files-found: error
